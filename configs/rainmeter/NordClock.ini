[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Nord Clock
Author=rocky desktop configuration
Information=Desktop clock. The desktop audio visualizer is a separate Fountain of Colors skin.
Version=1.0

[Variables]
Font=Sharp Grotesk 23
Text=216,222,233,240
Accent=136,192,208,235

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A  |  %d %B %Y

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=600
Y=0
W=600
H=160
StringAlign=Right
FontFace=#Font#
StringStyle=Semi Bold
FontSize=92
FontColor=#Text#
AntiAlias=1
Text=%1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=600
Y=140
W=600
H=30
StringAlign=Right
FontFace=#Font#
StringStyle=Regular
FontSize=18
FontColor=#Accent#
AntiAlias=1
Text=%1
